name: Julkaise GitHub Pagesiin

# Julkaisee pelin osoitteeseen https://kanijar.github.io/EquinoxUni/ aina kun main päivittyy.
# Vaatii kerran: repon Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pelaajalaskurin osoite (julkinen, ei salaisuus): repon Settings → Secrets and variables
          # → Actions → Variables → PRESENCE_URL. Jos sitä ei ole, laskuri on piilossa.
          VITE_PRESENCE_URL: ${{ vars.PRESENCE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
